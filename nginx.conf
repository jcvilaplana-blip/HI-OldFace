# ══════════════════════════════════════════════════════════════
# OldFace — Configuración Nginx para VPS con Plesk + Ubuntu 24
# Archivo: /etc/nginx/conf.d/oldface.conf
# O añadir en Plesk: Dominio → Apache & Nginx Settings → Additional nginx directives
# ══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name oldface.fullstark.es www.oldface.fullstark.es;    # ← CAMBIAR

    # Redirigir HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oldface.fullstark.es www.oldface.fullstark.es;    # ← CAMBIAR

    # SSL — Plesk lo gestiona automáticamente con Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/oldface.fullstark.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oldface.fullstark.es/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Frontend SPA (React/Vite build) ──────────────────────
    root /var/www/oldface/frontend/dist;   # ← ruta del build
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Cache assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: todas las rutas → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API — proxy al servidor Node.js ───────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── WebSocket (ZEGOCLOUD) ─────────────────────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Logs
    access_log /var/log/nginx/oldface-access.log;
    error_log  /var/log/nginx/oldface-error.log;
}
